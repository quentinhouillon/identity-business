[package]
name = "project_core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.10.2" }
getrandom = { version = "0.4", features = ["wasm_js"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
orion = "0.17.5"
argon2 = "0.5"
thiserror = "2"